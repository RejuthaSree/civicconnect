spring.application.name=backend
app.frontend-callback-url=${FRONTEND_CALLBACK_URL:http://localhost:5500}
spring.datasource.url=jdbc:postgresql://localhost:5432/civicconnect
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,email,profile

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:8000}


razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR
